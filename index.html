<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Precios — Tecno.Oeste</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5;
      --header-bg: #1e2124;
      --cat-bg: #2d3035;
      --cat-text: #ffffff;
      --row-hover: #f0f4ff;
      --border: #d8d8d4;
      --text: #1a1a18;
      --muted: #888;
      --accent: #1a6fff;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

    nav {
      background: var(--header-bg); padding: 0 2rem; height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo { font-family: var(--mono); font-size: 15px; font-weight: 500; color: #fff; text-decoration: none; }
    .logo span { color: #5b9eff; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .tc-display { font-family: var(--mono); font-size: 11px; color: #aaa; background: #2d3035; padding: 5px 12px; border-radius: 4px; }
    .tc-display strong { color: #5b9eff; }

    .page-header { background: var(--header-bg); padding: 2.5rem 2rem 2rem; border-bottom: 3px solid #3a3f45; }
    .page-header h1 { font-family: var(--sans); font-weight: 300; font-size: 2rem; color: #fff; letter-spacing: -0.03em; margin-bottom: 6px; }
    .page-header p { font-family: var(--mono); font-size: 11px; color: #666; letter-spacing: 0.06em; text-transform: uppercase; }

    .controls { max-width: 1200px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-wrap input {
      width: 100%; font-family: var(--mono); font-size: 13px;
      padding: 8px 12px 8px 34px; border: 1px solid var(--border);
      border-radius: 4px; background: #fff; color: var(--text); outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-family: var(--mono); font-size: 11px; padding: 5px 12px;
      border: 1px solid var(--border); border-radius: 999px;
      background: transparent; color: var(--muted); cursor: pointer;
      letter-spacing: 0.03em; transition: all 0.12s; white-space: nowrap;
    }
    .chip:hover { color: var(--text); border-color: #aaa; }
    .chip.active { background: var(--header-bg); color: #fff; border-color: var(--header-bg); }

    .table-wrap { max-width: 1200px; margin: 0 auto 3rem; padding: 0 2rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #fff; }
    thead tr { background: var(--header-bg); }
    thead th {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      color: #ccc; text-transform: uppercase; letter-spacing: 0.08em;
      padding: 12px 16px; text-align: left; border-right: 1px solid #3a3f45; white-space: nowrap;
    }
    thead th:last-child { border-right: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--row-hover) !important; }
    td { padding: 10px 16px; border-bottom: 1px solid var(--border); border-right: 1px solid #ebebeb; vertical-align: middle; }
    td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    .cat-row td { background: var(--cat-bg); color: var(--cat-text); font-weight: 500; font-size: 13px; padding: 9px 16px; }
    .group-a td { background: #fefefe; }
    .group-b td { background: #fdf9ec; }
    .group-a:hover td, .group-b:hover td { background: var(--row-hover) !important; }

    .product-cell { font-size: 13.5px; color: var(--text); }
    .price-usd { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; text-align: right; }
    .price-ars { font-family: var(--mono); font-size: 13px; font-weight: 500; color: #1a6fff; white-space: nowrap; text-align: right; }

    col.col-usd  { width: 100px; }
    col.col-ars  { width: 130px; }

    .cat-row .cat-warranty { font-weight: 400; font-size: 11px; color: #9aa3ad; margin-left: 10px; font-family: var(--mono); letter-spacing: 0.03em; }
    .badge { display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 3px; margin-left: 8px; vertical-align: 1px; letter-spacing: 0.04em; text-transform: uppercase; }
    .badge-oferta { background: #ffe4e1; color: #c0262d; }
    .badge-novedad { background: #e3edff; color: #1a55c9; }

    .empty-row td { text-align: center; padding: 3rem; color: var(--muted); font-family: var(--mono); font-size: 13px; }

    .page-footer { max-width: 1200px; margin: 0 auto 2rem; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .footer-count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    @media (max-width: 700px) {
      nav { padding: 0 1rem; }
      .page-header { padding: 1.5rem 1rem 1.25rem; }
      .controls, .table-wrap, .page-footer { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="logo">Tecno<span>.</span>Oeste</a>
  <div class="nav-right">
    <div class="tc-display">USD → ARS: <strong id="tc-nav">…</strong></div>
  </div>
</nav>

<div class="page-header">
  <h1>Lista de precios</h1>
  <p id="fecha-header">Actualizado: — · Precios en USD y ARS</p>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Buscar producto..." oninput="applyFilters()" />
  </div>
  <div class="filter-chips" id="chips"></div>
</div>

<div class="table-wrap">
  <table>
    <colgroup>
      <col />
      <col class="col-usd" />
      <col class="col-ars" />
    </colgroup>
    <thead>
      <tr>
        <th>Producto</th>
        <th style="text-align:right;">Precio USD</th>
        <th style="text-align:right;">Precio ARS</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="page-footer">
  <span class="footer-count" id="footer-count"></span>
  <span class="footer-count">Tecno.Oeste &copy; 2026</span>
</div>

<script>
// ===== LECTURA DE LA LISTA DE PRECIOS (Google Sheets) =====
// La planilla tiene que estar compartida como "Cualquier persona con el enlace · Lector".
const SHEET_ID   = "190wlr3dU8sh6pItfsxx35fz2N0CnD_p6GX0Wg-MybWs";
const SHEET_NAME = "CELULARES"; // nombre de la pestaña
const SHEET_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(SHEET_NAME)}`;

// CSV con comillas, comillas dobles escapadas y saltos de línea dentro de celdas
function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// "USD1.290,00" -> 1290 · "$1.182.600,00" -> 1182600 · "730" -> 730
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).replace(/[^0-9.,]/g, "");
  if (!t) return NaN;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  return parseFloat(t);
}

// Saca emojis y símbolos decorativos
function cleanText(s) {
  return String(s)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{25A0}-\u{25FF}\u{FE0F}\u{200D}*]/gu, " ")
    .replace(/\s+/g, " ").trim();
}

function parseCategory(raw) {
  const t = cleanText(raw);
  const m = t.match(/\b(GARANT[IÍ]A|GTIA\.?)(.*)$/i);
  let name = m ? t.slice(0, m.index) : t;
  name = name.replace(/[\s\-–·|]+$/, "").trim();
  const warranty = m ? ("Garantía" + m[2].replace(/\s+/g, " ")).trim() : "";
  return { name: name || t, warranty };
}

function parseProduct(raw) {
  let t = cleanText(raw);
  const badges = [];
  if (/\bOFERT(A|ON)\b/i.test(t)) badges.push("Oferta");
  if (/\bNOVEDAD\b/i.test(t)) badges.push("Novedad");
  t = t.replace(/\b(SUPER\s+)?OFERT(A|ON)\b|\bNOVEDAD\b/gi, " ").replace(/\s+/g, " ").trim();
  return { name: t, badges };
}

// Devuelve { tc, fecha, categories:[{name,warranty,items:[{name,usd,ars,badges}]}] }
function parseSheet(rows) {
  let tc = NaN, fecha = "", cur = null;
  const categories = [];
  for (const r of rows) {
    const cells = r.map(x => (x || "").trim());
    const [a = "", b = "", c = "", d = ""] = cells;

    const f = cells.join(" ").match(/LISTA DE PRECIOS\s+(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
    if (f) { fecha = f[1]; continue; }

    const di = cells.findIndex(x => /^d[oó]lar$/i.test(x));
    if (di >= 0) { const v = parseNum(cells[di + 1]); if (v > 0) tc = v; continue; }

    if (!a) continue;
    const usd = parseNum(b), ars = parseNum(c);

    if (usd > 0) {                       // fila de producto
      if (cur) cur.items.push({ ...parseProduct(a), usd, ars: ars > 0 ? ars : NaN });
      continue;
    }
    if (!isNaN(ars) || /especificaciones/i.test(d)) continue; // producto sin precio cargado
    cur = { ...parseCategory(a), items: [] };                  // posible categoría
    categories.push(cur);
  }

  const cats = categories.filter(c => c.items.length);
  // Si no se encontró la fila "DOLAR", se deduce de la columna de pesos
  if (!(tc > 0)) {
    const ref = cats.flatMap(c => c.items).find(i => i.ars > 0);
    if (ref) tc = ref.ars / ref.usd;
  }
  cats.forEach(c => c.items.forEach(i => { if (!(i.ars > 0)) i.ars = i.usd * tc; }));
  return { tc, fecha, categories: cats };
}

async function loadPriceList() {
  const res = await fetch(SHEET_URL, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseSheet(parseCSV(await res.text()));
}
// ===== FIN LECTURA =====


let TC = parseFloat(localStorage.getItem("tc") || "0");
let data = [];
let catOrder = [];
let warranties = {};
let categories = ["Todas"];
let activeFilter = "Todas";

function setFecha(fecha) {
  const txt = fecha || new Date().toLocaleDateString("es-AR", {day:"numeric", month:"long", year:"numeric"});
  document.getElementById("fecha-header").textContent = "Actualizado: " + txt + " · Precios en USD y ARS";
}
setFecha("");

function updateTCDisplay() {
  document.getElementById("tc-nav").textContent = TC > 0 ? "$" + Math.round(TC).toLocaleString("es-AR") : "—";
}

const chipsEl = document.getElementById("chips");
function renderChips() {
  chipsEl.innerHTML = "";
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip" + (cat === activeFilter ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilter = cat;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      applyFilters();
    };
    chipsEl.appendChild(btn);
  });
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fmtARS(r) {
  const v = r.ars > 0 ? r.ars : r.price * TC;
  return "$" + Math.round(v).toLocaleString("es-AR");
}

function showMessage(msg) {
  document.getElementById("tbody").innerHTML = `<tr class="empty-row"><td colspan="3">${msg}</td></tr>`;
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  const filtered = data.filter(r => {
    const matchCat = activeFilter === "Todas" || r.cat === activeFilter;
    const matchQ = !q || r.name.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById("footer-count").textContent =
    filtered.length + " producto" + (filtered.length !== 1 ? "s" : "") + " mostrado" + (filtered.length !== 1 ? "s" : "");
  if (filtered.length === 0) { showMessage("Sin resultados."); return; }

  const grouped = {};
  filtered.forEach(r => { (grouped[r.cat] = grouped[r.cat] || []).push(r); });
  let groupIdx = 0;
  catOrder.filter(c => grouped[c]).forEach(cat => {
    const catRow = document.createElement("tr");
    catRow.className = "cat-row";
    const w = warranties[cat] ? `<span class="cat-warranty">${esc(warranties[cat])}</span>` : "";
    catRow.innerHTML = `<td colspan="3">${esc(cat)}${w}</td>`;
    tbody.appendChild(catRow);
    const cls = groupIdx % 2 === 0 ? "group-a" : "group-b";
    grouped[cat].forEach(r => {
      const badges = r.badges.map(b => `<span class="badge badge-${b.toLowerCase()}">${b}</span>`).join("");
      const tr = document.createElement("tr");
      tr.className = cls;
      tr.innerHTML = `
        <td class="product-cell">${esc(r.name)}${badges}</td>
        <td class="price-usd">US$ ${r.price.toLocaleString("en-US")}</td>
        <td class="price-ars">${fmtARS(r)}</td>
      `;
      tbody.appendChild(tr);
    });
    groupIdx++;
  });
}

// Inicialización de la página
(async () => {
  showMessage("Cargando precios…");
  try {
    const lista = await loadPriceList();
    if (lista.tc > 0) { TC = lista.tc; localStorage.setItem("tc", TC); }
    setFecha(lista.fecha);
    data = []; catOrder = []; warranties = {};
    lista.categories.forEach(c => {
      catOrder.push(c.name);
      warranties[c.name] = c.warranty;
      c.items.forEach(i => data.push({ cat: c.name, name: i.name, price: i.usd, ars: i.ars, badges: i.badges }));
    });
    if (!data.length) throw new Error("La planilla no devolvió productos");
    categories = ["Todas", ...catOrder];
    renderChips();
    updateTCDisplay();
    applyFilters();
  } catch (e) {
    console.error(e);
    updateTCDisplay();
    showMessage("No se pudo cargar la lista de precios. Intentá de nuevo en unos minutos.");
  }
})();
</script>
</body>
</html>
